<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard - Luxe Jewelry</title>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d4af37;
      --primary-dark: #b6912e;
      --secondary: #333;
      --light: #f9f6f1;
      --light-2: #f4e7c5;
      --muted: #999;
      --card-bg: #fff;
      --border: #e0cba0;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s ease;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--light), var(--light-2));
      color: var(--secondary);
      min-height: 100vh;
    }

    /* ========== HEADER ========== */
    .header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--border);
      padding: 20px 0;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--secondary);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: rgba(212, 175, 55, 0.05);
    }

    .btn-logout {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
    }

    /* ========== MAIN CONTAINER ========== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* ========== TABS ========== */
    .tab-navigation {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }

    .tab-btn {
      padding: 12px 20px;
      background: transparent;
      border: 2px solid var(--border);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--secondary);
      border-radius: 8px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .tab-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-color: var(--primary);
    }

    .tab-btn i {
      font-size: 1.1rem;
    }

    /* ========== TAB CONTENT ========== */
    .tab-content {
      display: none;
      animation: slideIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== CARDS ========== */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-size: 1.3rem;
      color: var(--secondary);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card h2 i {
      color: var(--primary);
      font-size: 1.3rem;
    }

    /* ========== PROFILE SECTION ========== */
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .profile-item {
      background: var(--light);
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .profile-item label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .profile-item value,
    .profile-item .profile-value {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--secondary);
      word-break: break-word;
    }

    /* ========== FORM GROUPS ========== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group label i {
      color: var(--primary);
      font-size: 1rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    /* ========== BUTTONS ========== */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.3);
    }

    .btn-secondary {
      background: var(--light);
      color: var(--secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ========== ORDERS TABLE ========== */
    .orders-container {
      display: grid;
      gap: 16px;
    }

    .order-card {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: start;
      transition: var(--transition);
    }

    .order-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .order-info {
      flex: 1;
    }

    .order-ref {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
      font-family: 'Courier New', monospace;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .order-detail {
      display: flex;
      flex-direction: column;
    }

    .order-detail-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .order-detail-value {
      font-weight: 600;
      color: var(--secondary);
      margin-top: 4px;
    }

    .order-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-paid {
      background: #d4edda;
      color: #155724;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-failed {
      background: #f8d7da;
      color: #721c24;
    }

    /* ========== ADDRESSES ========== */
    .addresses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .address-card {
      background: var(--light);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      position: relative;
      transition: var(--transition);
    }

    .address-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .address-label {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .address-default {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #28a745;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .address-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--secondary);
      margin-bottom: 12px;
    }

    .address-actions {
      display: flex;
      gap: 8px;
    }

    .address-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      border-radius: 6px;
      transition: var(--transition);
    }

    .address-actions button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ========== EMPTY STATE ========== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state i {
      font-size: 3rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .empty-state p {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .header-content {
        flex-direction: column;
        gap: 12px;
      }

      .tab-navigation {
        flex-direction: column;
      }

      .tab-btn {
        width: 100%;
        justify-content: center;
      }

      .order-card {
        flex-direction: column;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .btn-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }

    /* ========== LOADING ========== */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      border: 4px solid var(--light);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <div class="header">
    <div class="header-content">
      <h1><i class="fas fa-user-circle"></i> My Dashboard</h1>
      <div class="header-actions">
        <button class="btn-back" onclick="window.location.href='/index.html'">
          <i class="fas fa-arrow-left"></i> Back to Shop
        </button>
        <button class="btn-logout" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="container">
    <!-- TAB NAVIGATION -->
    <div class="tab-navigation">
      <button class="tab-btn active" data-tab="profile">
        <i class="fas fa-user"></i> Profile
      </button>
      <button class="tab-btn" data-tab="orders">
        <i class="fas fa-box"></i> Orders
      </button>
      <button class="tab-btn" data-tab="addresses">
        <i class="fas fa-map-marker-alt"></i> Addresses
      </button>
    </div>

    <!-- PROFILE TAB -->
    <div class="tab-content active" id="profile">
      <div class="card">
        <h2><i class="fas fa-id-card"></i> Profile Information</h2>
        
        <div class="profile-grid">
          <div class="profile-item">
            <label><i class="fas fa-user"></i> Full Name</label>
            <span id="profileName" class="profile-value">UI Test User 1764516534329</span>
          </div>
          <div class="profile-item">
            <label><i class="fas fa-envelope"></i> Email</label>
            <span id="profileEmail" class="profile-value">testcustomer@example.com</span>
          </div>
          <div class="profile-item">
            <label><i class="fas fa-phone"></i> Phone</label>
            <span id="profilePhone" class="profile-value">08082896296</span>
          </div>
          <div class="profile-item">
            <label><i class="fas fa-calendar"></i> Member Since</label>
            <span id="profileCreatedAt" class="profile-value">29/11/2025</span>
          </div>
        </div>

        <h2 style="margin-top: 30px;"><i class="fas fa-lock"></i> Update Profile</h2>
        <form id="updateProfileForm">
          <div class="form-row">
            <div class="form-group">
              <label for="updateName"><i class="fas fa-user"></i> Full Name</label>
              <input type="text" id="updateName" required />
            </div>
            <div class="form-group">
              <label for="updatePhone"><i class="fas fa-phone"></i> Phone Number</label>
              <input type="tel" id="updatePhone" />
            </div>
          </div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Save Changes
            </button>
            <button type="reset" class="btn btn-secondary">
              <i class="fas fa-redo"></i> Reset
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ORDERS TAB -->
    <div class="tab-content" id="orders">
      <div class="card">
        <h2><i class="fas fa-shopping-bag"></i> Your Orders</h2>
        
        <div id="ordersContainer" class="orders-container">
          <div class="loading">
            <div class="spinner"></div>
            <p>Loading orders...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ADDRESSES TAB -->
    <div class="tab-content" id="addresses">
      <div class="card">
        <h2><i class="fas fa-map-marker-alt"></i> My Addresses</h2>
        
        <div id="addressesContainer" class="addresses-grid">
          <div class="loading">
            <div class="spinner"></div>
            <p>Loading addresses...</p>
          </div>
        </div>

        <h2 style="margin-top: 30px;"><i class="fas fa-plus"></i> Add New Address</h2>
        <form id="addAddressForm">
          <div class="form-group">
            <label for="addressLabel"><i class="fas fa-tag"></i> Label (Home, Work, etc.)</label>
            <input type="text" id="addressLabel" placeholder="e.g., Home" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="addressStreet"><i class="fas fa-road"></i> Street</label>
              <input type="text" id="addressStreet" placeholder="123 Main Street" required />
            </div>
            <div class="form-group">
              <label for="addressCity"><i class="fas fa-city"></i> City</label>
              <input type="text" id="addressCity" placeholder="Lagos" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="addressZip"><i class="fas fa-envelope"></i> Postal Code</label>
              <input type="text" id="addressZip" placeholder="100001" required />
            </div>
            <div class="form-group">
              <label for="addressDefault">
                <input type="checkbox" id="addressDefault" /> Set as default address
              </label>
            </div>
          </div>
          <div class="btn-group">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-plus"></i> Add Address
            </button>
            <button type="reset" class="btn btn-secondary">
              <i class="fas fa-redo"></i> Clear Form
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // API configuration
    const API_URL = '';

    // Check authentication
    function checkAuth() {
      const token = localStorage.getItem('authToken');
      const user = localStorage.getItem('user');

      if (!token || !user) {
        alert('Please log in first');
        window.location.href = '/customer-login.html';
        return false;
      }
      return JSON.parse(user);
    }

    const userData = checkAuth();
    if (!userData) return;

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('authToken');
        localStorage.removeItem('user');
        alert('Logged out successfully');
        window.location.href = '/index.html';
      }
    });

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        btn.classList.add('active');
        document.getElementById(tabName).classList.add('active');

        // Load tab data
        if (tabName === 'orders') loadOrders();
        if (tabName === 'addresses') loadAddresses();
      });
    });

    // Load profile data
    async function loadProfile() {
      try {
        const token = localStorage.getItem('authToken');
        if (!token) {
          console.error('No auth token found');
          return;
        }
        
        console.log('Loading profile with token:', token.substring(0, 20) + '...');
        
        const res = await fetch(`${API_URL}/api/customer/profile`, {
          method: 'GET',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        console.log('Profile response status:', res.status);
        
        if (!res.ok) {
          console.error('Profile fetch failed:', res.status, res.statusText);
          // Fallback to localStorage data
          const user = JSON.parse(localStorage.getItem('user'));
          if (user) {
            displayProfile(user);
          }
          return;
        }
        
        const data = await res.json();
        console.log('Profile data received:', data);
        
        const profile = data.user || data;
        if (profile && profile._id) {
          displayProfile(profile);
        } else {
          console.error('Profile object is null or missing _id');
        }
      } catch (err) {
        console.error('Error loading profile:', err);
        // Fallback to localStorage
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
          displayProfile(user);
        }
      }
    }

    // Helper to display profile data
    function displayProfile(profile) {
      console.log('Displaying profile:', profile);
      
      if (!profile) return;

      const nameEl = document.getElementById('profileName');
      const emailEl = document.getElementById('profileEmail');
      const phoneEl = document.getElementById('profilePhone');
      const createdEl = document.getElementById('profileCreatedAt');
      
      if (nameEl) nameEl.textContent = profile.name || 'N/A';
      if (emailEl) emailEl.textContent = profile.email || 'N/A';
      if (phoneEl) phoneEl.textContent = profile.phone || 'Not provided';
      if (createdEl) createdEl.textContent = profile.createdAt ? new Date(profile.createdAt).toLocaleDateString() : 'N/A';

      document.getElementById('updateName').value = profile.name || '';
      document.getElementById('updatePhone').value = profile.phone || '';
      
      console.log('Profile UI populated successfully');
    }

    // Load orders
    async function loadOrders() {
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(`${API_URL}/api/customer/orders`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const orders = data.orders || data || [];

        const container = document.getElementById('ordersContainer');
        
        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <p>No orders yet</p>
              <a href="/index.html" class="btn btn-primary">
                <i class="fas fa-shopping-bag"></i> Start Shopping
              </a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(order => `
          <div class="order-card">
            <div class="order-info">
              <div class="order-ref"><i class="fas fa-hashtag"></i> ${order.reference}</div>
              <div class="order-details">
                <div class="order-detail">
                  <span class="order-detail-label">Amount</span>
                  <span class="order-detail-value">₦${Number(order.amount).toLocaleString()}</span>
                </div>
                <div class="order-detail">
                  <span class="order-detail-label">Date</span>
                  <span class="order-detail-value">${new Date(order.date || order.paidAt).toLocaleDateString()}</span>
                </div>
                <div class="order-detail">
                  <span class="order-detail-label">Status</span>
                  <span class="order-status status-${(order.status || 'pending').toLowerCase()}">
                    ${order.status || 'Pending'}
                  </span>
                </div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading orders:', err);
        document.getElementById('ordersContainer').innerHTML = '<p style="color: red;">Failed to load orders</p>';
      }
    }

    // Load addresses
    async function loadAddresses() {
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(`${API_URL}/api/customer/addresses`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const addresses = data.addresses || data || [];

        const container = document.getElementById('addressesContainer');
        
        if (!addresses || addresses.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1;">
              <div class="empty-state">
                <i class="fas fa-map-marker-alt"></i>
                <p>No addresses saved yet</p>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = addresses.map((addr, idx) => `
          <div class="address-card">
            ${addr.isDefault ? '<div class="address-default"><i class="fas fa-check"></i> Default</div>' : ''}
            <div class="address-label">${addr.label || 'Address'}</div>
            <div class="address-text">
              ${addr.street}<br>
              ${addr.city}, ${addr.zipcode}
            </div>
            <div class="address-actions">
              <button onclick="setDefaultAddress('${addr._id}')"><i class="fas fa-star"></i> Set Default</button>
              <button onclick="deleteAddress('${addr._id}')" style="color: red;"><i class="fas fa-trash"></i> Delete</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error loading addresses:', err);
        document.getElementById('addressesContainer').innerHTML = '<p style="color: red;">Failed to load addresses</p>';
      }
    }

    // Helper functions
    async function setDefaultAddress(addressId) {
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(`${API_URL}/api/customer/addresses/${addressId}`, {
          method: 'PATCH',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ isDefault: true })
        });
        if (res.ok) {
          loadAddresses();
        }
      } catch (err) {
        console.error('Error setting default address:', err);
      }
    }

    async function deleteAddress(addressId) {
      if (!confirm('Are you sure you want to delete this address?')) return;
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(`${API_URL}/api/customer/addresses/${addressId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          loadAddresses();
        }
      } catch (err) {
        console.error('Error deleting address:', err);
      }
    }

    // Form handlers
    document.getElementById('updateProfileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(`${API_URL}/api/customer/profile`, {
          method: 'PATCH',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: document.getElementById('updateName').value,
            phone: document.getElementById('updatePhone').value
          })
        });
        const result = await res.json();
        if (res.ok) {
          alert('Profile updated successfully!');
          // Update localStorage with the returned user object (safer than partial updates)
          if (result && result.user) {
            localStorage.setItem('user', JSON.stringify(result.user));
            // Immediately update UI with returned values
            displayProfile(result.user);
          } else {
            // Fallback: update partial fields
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            user.name = document.getElementById('updateName').value;
            user.phone = document.getElementById('updatePhone').value;
            localStorage.setItem('user', JSON.stringify(user));
            loadProfile();
          }
        } else {
          alert('Error: ' + (result.message || 'Failed to update profile'));
        }
      } catch (err) {
        console.error('Error updating profile:', err);
        alert('Error updating profile');
      }
    });

    document.getElementById('addAddressForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const token = localStorage.getItem('authToken');
        const res = await fetch(`${API_URL}/api/customer/addresses`, {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            label: document.getElementById('addressLabel').value,
            street: document.getElementById('addressStreet').value,
            city: document.getElementById('addressCity').value,
            zipcode: document.getElementById('addressZip').value,
            isDefault: document.getElementById('addressDefault').checked
          })
        });
        const result = await res.json();
        if (res.ok) {
          alert('Address added successfully!');
          document.getElementById('addAddressForm').reset();
          loadAddresses();
        } else {
          alert('Error: ' + (result.message || 'Failed to add address'));
        }
      } catch (err) {
        console.error('Error adding address:', err);
        alert('Error adding address');
      }
    });

    // Initialize - Run on page load
    window.addEventListener('DOMContentLoaded', async () => {
      console.log('Page loaded, initializing customer dashboard...');
      
      // Display profile from localStorage immediately
      const user = JSON.parse(localStorage.getItem('user'));
      if (user) {
        console.log('Found user in localStorage:', user.email);
        displayProfile(user);
      }
      
      // Then fetch fresh data from API
      await loadProfile();
      await loadOrders();
      await loadAddresses();
      console.log('Dashboard initialization complete');
    });
  </script>
</body>
</html>
