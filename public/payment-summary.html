<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Summary - Luxe Jewelry</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d4af37;
      --primary-dark: #b6912e;
      --secondary: #333;
      --light: #f9f6f1;
      --light-2: #f4e7c5;
      --muted: #999;
      --card-bg: #fff;
      --border: #e0cba0;
      --shadow: 0 8px 24px rgba(0,0,0,0.12);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --transition: all 0.3s ease;
    }
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--light), var(--light-2));
      color: var(--secondary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 28px;
      animation: slideUp 0.6s ease;
      border: 1px solid rgba(212, 175, 55, 0.1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .card-header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
    }
    .card-header h1 {
      font-size: 1.5rem;
      color: var(--secondary);
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .card-header p {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }
    .section {
      margin-bottom: 20px;
    }
    .section-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section-label i {
      color: var(--primary);
      font-size: 1.1rem;
    }
    .order-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: linear-gradient(135deg, var(--light) 0%, #f9f5f0 100%);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding: 8px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      transition: var(--transition);
    }
    .order-item:hover {
      padding-left: 8px;
      padding-right: 8px;
    }
    .order-item:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 8px; }
    .item-name { 
      font-weight: 600; 
      color: var(--secondary);
    }
    .item-qty { 
      color: var(--muted); 
      font-size: 0.8rem;
      font-weight: 500;
    }
    .item-right { 
      color: var(--primary); 
      font-weight: 700;
      font-size: 0.9rem;
    }
    .summary {
      background: linear-gradient(135deg, var(--light) 0%, #f9f5f0 100%);
      padding: 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-line.total {
      border-top: 2px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
      font-weight: 700;
      color: var(--primary);
      font-size: 1rem;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--secondary);
      text-transform: capitalize;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Poppins', inherit;
      transition: var(--transition);
      background: var(--card-bg);
      color: var(--secondary);
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
      background: rgba(212, 175, 55, 0.02);
    }
    .form-group input::placeholder, .form-group textarea::placeholder {
      color: var(--muted);
    }
    .form-group textarea { 
      resize: vertical; 
      min-height: 70px;
      line-height: 1.5;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    .btn {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-continue {
      flex: 1;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
    }
    .btn-continue:hover:not(:disabled) { 
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(212, 175, 55, 0.35);
      background: linear-gradient(135deg, #e8c547, #c89a26);
    }
    .btn-continue:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-continue:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
    }
    .btn-back {
      flex: 0 1 140px;
      background: var(--card-bg);
      color: var(--secondary);
      border: 2px solid var(--border);
      font-weight: 700;
    }
    .btn-back:hover { 
      background: linear-gradient(135deg, var(--light), #f9f5f0);
      border-color: var(--primary);
      color: var(--primary);
    }
    .loading { 
      display: none; 
      text-align: center; 
      padding: 14px; 
      color: var(--primary); 
      font-size: 0.85rem;
      font-weight: 600;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(212, 175, 55, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .alert {
      padding: 11px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.8rem;
      font-weight: 600;
      border-left: 4px solid;
    }
    .alert.error { 
      background: rgba(220, 53, 69, 0.08); 
      border-left-color: #dc3545;
      color: #dc3545;
      display: block; 
    }
    @media (max-width: 768px) {
      .container {
        padding: 20px;
        max-width: 420px;
      }
      .card-header h1 {
        font-size: 1.3rem;
      }
      .button-group {
        flex-direction: column-reverse;
      }
      .btn-back {
        flex: 1;
      }
    }
  </style>
  </style>
</head>
<body>
  <div class="container">
    <div id="maintenanceModeBanner" style="display: none; background: linear-gradient(135deg, #dc3545, #c82333); color: white; padding: 16px; border-radius: 12px; text-align: center; box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3); position: relative; margin-bottom: 20px; border-left: 4px solid #fff;">
      <p style="margin: 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;"><i class="fas fa-tools"></i> Store Under Maintenance</p>
      <p style="margin: 8px 0 0 0; font-size: 0.9rem; opacity: 0.95;">Checkout is temporarily disabled. Please try again later.</p>
    </div>
        <div class="card-header">
          <h1><i class="fas fa-receipt" style="color: var(--primary); margin-right: 10px;"></i>Order Summary</h1>
          <p>Review & confirm your order before payment</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="section">
          <div class="section-label"><i class="fas fa-box"></i> Order Items</div>
          <div class="order-items" id="orderItems"></div>
        </div>

        <div class="section">
          <div class="summary">
            <div class="summary-line">
              <span>Subtotal</span> 
              <span id="subtotal" data-cart-total style="font-weight: 700;">₦0</span>
            </div>
            <div class="summary-line">
              <span>Discount</span>
              <span id="discountAmount" data-discount-amount>₦0</span>
            </div>
            <div class="summary-line total">
              <span>Total Amount</span> 
              <span id="totalAmount" data-final-total>₦0</span>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-label"><i class="fas fa-ticket-alt"></i> Coupon</div>
          <div class="coupon-card" style="background:#fff; border:1px solid rgba(212,175,55,0.18); border-radius:12px; padding:16px; margin-bottom:20px;">
            <form data-coupon-form>
              <div class="form-group">
                <label>Coupon Code</label>
                <input type="text" data-coupon-input placeholder="Enter coupon code" style="width:100%;" />
              </div>
              <div class="form-group" style="margin-top:0;">
                <button type="submit" class="btn btn-continue" data-coupon-apply style="width:100%;">Apply Coupon</button>
              </div>
              <div data-coupon-message style="display:none; font-size:0.9rem; line-height:1.4;"></div>
            </form>
          </div>
        </div>

        <div class="section">
          <div class="section-label"><i class="fas fa-map-pin"></i> Delivery Address</div>
          <form id="deliveryForm">
        <div class="form-group">
          <label><i class="fas fa-user" style="color: var(--primary); margin-right: 6px;"></i>Full Name *</label>
          <input type="text" id="fullName" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope" style="color: var(--primary); margin-right: 6px;"></i>Email *</label>
          <input type="email" id="email" placeholder="your.email@example.com" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-phone" style="color: var(--primary); margin-right: 6px;"></i>Phone *</label>
          <input type="tel" id="phone" placeholder="08012345678" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-home" style="color: var(--primary); margin-right: 6px;"></i>Address *</label>
          <textarea id="address" placeholder="Street address, city, state, zip code" required></textarea>
        </div>
      </form>
    </div>

    <div class="button-group">
      <button class="btn btn-back" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
      <button class="btn btn-continue" id="continueBtn" onclick="proceedToPayment()"><i class="fas fa-credit-card"></i> Proceed to Pay</button>
    </div>
    <div class="loading" id="loading"><span class="spinner"></span> Processing your payment...</div>
  </div>

  <script>
    let cartData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // Get cart data from sessionStorage
      const storedCartData = sessionStorage.getItem('cartData');
      const authToken = localStorage.getItem('authToken');

      if (!storedCartData) {
        showAlert('Session expired. Redirecting to home...', 'error');
        setTimeout(() => window.location.href = '/index.html', 2000);
        return;
      }

      cartData = JSON.parse(storedCartData);

      // Get user data if logged in, otherwise leave fields empty for guest checkout
      const userData = JSON.parse(localStorage.getItem('user'));
      
      if (userData) {
        // Pre-fill form with logged-in user data
        document.getElementById('fullName').value = userData.name || '';
        document.getElementById('email').value = userData.email || '';
        document.getElementById('phone').value = userData.phone || '';
        
        // Try to fetch saved address from customer profile if logged in
        if (authToken) {
          try {
            const addressRes = await fetch('/api/customer/addresses', {
              headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (addressRes.ok) {
              const addressData = await addressRes.json();
              const addresses = addressData.addresses || addressData.data || [];
              if (addresses.length > 0) {
                const primaryAddress = addresses.find(a => a.isDefault) || addresses[0];
                const fullAddress = `${primaryAddress.street || ''}, ${primaryAddress.city || ''}, ${primaryAddress.state || ''} ${primaryAddress.zip || ''}, ${primaryAddress.country || ''}`.trim();
                document.getElementById('address').value = fullAddress;
              }
            }
          } catch (err) {
            console.warn('Could not fetch saved address:', err);
            // Fall back to userData address
            document.getElementById('address').value = userData.address || '';
          }
        } else {
          document.getElementById('address').value = userData.address || '';
        }
      }
      // If guest checkout, fields remain empty for customer to fill in

      renderOrderItems();
      calculateTotals();
    });

    function renderOrderItems() {
      if (!cartData || !cartData.items || cartData.items.length === 0) {
        document.getElementById('orderItems').innerHTML = '<p style="color: #999;">No items in cart</p>';
        return;
      }

      const itemsContainer = document.getElementById('orderItems');
      itemsContainer.innerHTML = cartData.items.map(item => `
        <div class="order-item" data-cart-item data-product-id="${item.productId || item._id || ''}" data-category="${item.category || ''}">
          <div class="item-left">
            <span class="item-name">${item.name}</span>
            <span class="item-qty">${item.qty} x ₦${Number(item.price).toLocaleString()}</span>
          </div>
          <div class="item-right">₦${(item.price * item.qty).toLocaleString()}</div>
        </div>
      `).join('');
    }

    function calculateTotals() {
      if (!cartData || !cartData.items) return;

      const subtotal = cartData.items.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
      const total = subtotal;

      document.getElementById('subtotal').textContent = '₦' + Math.round(subtotal).toLocaleString();
      document.getElementById('totalAmount').textContent = '₦' + Math.round(total).toLocaleString();

      // Store final amount for payment
      cartData.subtotal = Math.round(subtotal);
      cartData.tax = 0;
      cartData.total = Math.round(total);
    }

    function showAlert(message, type) {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert ${type}`;
    }

    function goBack() {
      window.history.back();
    }

    async function proceedToPayment() {
      // Check if store is in maintenance mode
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        const maintenanceMode = settings.find((s) => s.key === "maintenanceMode")?.value === "true" || settings.find((s) => s.key === "maintenanceMode")?.value === true;
        
        if (maintenanceMode) {
          showAlert('❌ Store is currently under maintenance. Checkout is temporarily disabled. Please try again later.', 'error');
          return;
        }
      } catch (err) {
        console.error("Error checking maintenance mode:", err);
      }

      const form = document.getElementById('deliveryForm');
      if (!form.checkValidity()) {
        showAlert('Please fill in all required fields.', 'error');
        form.reportValidity();
        return;
      }

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();

      // Validate
      if (!fullName || !email || !phone || !address) {
        showAlert('All fields are required.', 'error');
        return;
      }

      if (!cartData || !cartData.items || cartData.items.length === 0) {
        showAlert('Cart is empty. Please add items before checkout.', 'error');
        return;
      }

      if (!cartData.total || cartData.total <= 0) {
        showAlert('Invalid cart total. Please go back and try again.', 'error');
        return;
      }

      const couponManager = window.couponManager;
      if (couponManager && typeof couponManager.getAppliedCoupon === 'function') {
        const { discount = 0 } = couponManager.getAppliedCoupon() || {};
        if (discount && cartData.total > 0) {
          cartData.total = Math.max(0, cartData.total - discount);
          console.log('🔖 Coupon discount applied:', discount, 'Final total:', cartData.total);
        }
      }

      try {
        document.getElementById('continueBtn').disabled = true;
        document.getElementById('loading').style.display = 'block';
        showAlert('', '');

        // Format items for API
        const items = cartData.items.map(item => ({
          name: item.name,
          productName: item.name,
          price: Number(item.price),
          qty: Number(item.qty),
          quantity: Number(item.qty),
          _id: item._id
        }));

        console.log('🛒 Sending payment session:', {
          email,
          name: fullName,
          phone,
          address,
          itemsCount: items.length,
          amount: cartData.total
        });

        // Obtain CSRF token (server sets CSRF cookie) and include credentials
        let csrfToken = null;
        try {
          const csrfResp = await fetch('/api/csrf-token', { credentials: 'same-origin' });
          if (csrfResp && csrfResp.ok) {
            const json = await csrfResp.json();
            csrfToken = json && (json.csrfToken || json.token || json.csrf);
          }
        } catch (e) {
          // ignore: we'll still try the request and show server error if it fails
        }

        // Also notify server with logging endpoint (include CSRF header and credentials)
        await fetch('/api/log', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', ...(csrfToken ? { 'X-CSRF-Token': csrfToken } : {}) },
          body: JSON.stringify({
            action: 'payment_started',
            email,
            name: fullName,
            itemsCount: items.length,
            amount: cartData.total
          })
        }).catch(() => {});

        // Create payment session with all required fields (include CSRF and credentials)
        const res = await fetch('/api/pay-now', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', ...(csrfToken ? { 'X-CSRF-Token': csrfToken } : {}) },
          body: JSON.stringify({
            email,
            name: fullName,
            phone,
            address,
            items,
            amount: cartData.total
          })
        });

        const data = await res.json();
        console.log('📨 /api/pay-now response:', data);
        
        if (!res.ok) {
          throw new Error(data.message || `HTTP ${res.status}: ${JSON.stringify(data)}`);
        }

        if (!data.success) {
          throw new Error(data.message || 'Failed to create payment session');
        }

        console.log('✅ Session created. sessionId:', data.sessionId);

        // Save session ID and cart data for payment processing
        sessionStorage.setItem('verifiedSessionId', data.sessionId);
        sessionStorage.setItem('cart', JSON.stringify(items));

        console.log('🔄 Redirecting to payment-process.html');
        window.location.href = '/payment-process.html';

      } catch (error) {
        console.error('❌ Payment error:', error);
        showAlert(error.message || 'Failed to proceed with payment.', 'error');
        document.getElementById('continueBtn').disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    }

    // Check maintenance mode on page load
    async function checkMaintenanceMode() {
      try {
        const res = await fetch('/api/settings');
        const settings = await res.json();
        const maintenanceMode = settings.find((s) => s.key === "maintenanceMode")?.value === "true" || settings.find((s) => s.key === "maintenanceMode")?.value === true;
        
        if (maintenanceMode) {
          document.getElementById('maintenanceModeBanner').style.display = 'block';
          document.getElementById('continueBtn').disabled = true;
        }
      } catch (err) {
        console.error("Error checking maintenance mode:", err);
      }
    }

    document.addEventListener('DOMContentLoaded', checkMaintenanceMode);
  </script>
  <script src="/js/coupon-manager.js"></script>
  <script src="/cart-manager.js"></script>
</body>
</html>
