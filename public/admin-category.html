<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Categories | Brilliant eSystem</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/admin-shell.css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      padding: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      background: #0078d7;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #0078d7;
      color: white;
    }
    tr:hover {
      background: #f1f1f1;
    }
    .delete-btn {
      background: #e74c3c;
      padding: 6px 10px;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>
  <h1><i class="fas fa-folder"></i> Manage Categories</h1>

  <form id="categoryForm">
    <input type="text" id="categoryName" placeholder="Enter category name" required />
    <button type="submit"><i class="fas fa-plus"></i> Add Category</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Category Name</th>
        <th>Created At</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="categoryTableBody"></tbody>
  </table>

  <script>
    // ✅ Mandatory authentication check - require admin role
    const authToken = localStorage.getItem('authToken');
    const authRole = localStorage.getItem('authRole');
    if (!authToken || authRole !== 'admin') {
      alert('Access Denied — please sign in as Admin.');
      window.location.href = '/login.html';
    }

    const apiBase = "/api/categories";

    async function loadCategories() {
      const res = await fetch(apiBase);
      const categories = await res.json();
      const tbody = document.getElementById("categoryTableBody");
      tbody.innerHTML = "";

      categories.forEach((cat, index) => {
        const row = `
          <tr>
            <td>${index + 1}</td>
            <td>${cat.name}</td>
            <td>${new Date(cat.createdAt).toLocaleString()}</td>
            <td><button class="delete-btn" onclick="deleteCategory('${cat._id}')"><i class="fas fa-trash"></i> Delete</button></td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    async function addCategory(e) {
      e.preventDefault();
      const name = document.getElementById("categoryName").value.trim();
      if (!name) return alert("Please enter a category name");

      const res = await fetch(apiBase, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });

      const data = await res.json();
      if (data.success) {
        alert("Category added!");
        document.getElementById("categoryForm").reset();
        loadCategories();
      } else {
        alert((data.message || "Failed to add category"));
      }
    }

    async function deleteCategory(id) {
      if (!confirm("Are you sure you want to delete this category?")) return;
      await fetch(`${apiBase}/${id}`, { method: "DELETE" });
      loadCategories();
    }

    document.getElementById("categoryForm").addEventListener("submit", addCategory);
    loadCategories();
  </script>
  <script src="/admin-shell.js"></script>
</body>
</html>
