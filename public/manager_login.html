<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Login | Luxe Jewelry</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #fff8e1, #f4e7c5);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 40px 50px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      text-align: center;
      width: 350px;
      border-top: 5px solid #d4af37;
    }

    h2 {
      color: #d4af37;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    p {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 4px rgba(212, 175, 55, 0.4);
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }

    button:hover {
      background: #c59b2a;
      transform: translateY(-2px);
    }

    .error {
      color: crimson;
      margin-top: 10px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>Manager Login</h2>
    <p>Access to complaint management is restricted to Luxe Jewelry’s manager.</p>
    <p>Use the unified <a href="/login.html">Staff Login</a> page to sign in (select Manager role).</p>
  </div>

  <script>
    // Redirect to unified login page
    // (legacy manager login replaced)
  </script>
</body>
</html>
