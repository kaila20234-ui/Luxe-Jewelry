<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment - Luxe Jewelry</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #d4af37;
      --secondary: #101010;
      --light: #f8f8f8;
      --shadow: 0 6px 18px rgba(0,0,0,0.12);
      --transition: all .25s ease;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--light);
      color: var(--secondary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 40px 30px;
      text-align: center;
      animation: slideUp 0.6s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .spinner {
      width: 60px;
      height: 60px;
      margin: 0 auto 25px;
      border: 4px solid rgba(212, 175, 55, 0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 20px;
    }
    .status-text {
      font-size: 0.95rem;
      color: var(--secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .status-text strong { color: var(--primary); }
    .details {
      background: var(--light);
      padding: 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: left;
      color: #666;
      line-height: 1.6;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { font-weight: 600; color: var(--secondary); }
    .detail-row .value { color: var(--primary); }
    @media (max-width: 768px) {
      nav.center-nav {
        display: none;
      }
      .footer-top {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1 class="title"><i class="fas fa-clock"></i> Processing</h1>
    <p class="subtitle">Please wait while we process your payment</p>
    <p class="status-text">
      You will be redirected to <strong>Paystack</strong> to complete your payment securely.
      <br><br>
      <small style="color: #999;">Do not refresh or close this page.</small>
    </p>
    <div class="details" id="details"></div>
  </div>

  <script>
    async function initiatePayment() {
      const sessionId = sessionStorage.getItem('verifiedSessionId');
      if (!sessionId) {
        alert('Session not found. Redirecting back...');
        window.location.href = '/index.html';
        return;
      }

      try {
        console.log('🚀 Calling /api/pay with sessionId:', sessionId);

        // Obtain CSRF token (server sets CSRF cookie) and include credentials
        let csrfToken = null;
        try {
          const csrfResp = await fetch('/api/csrf-token', { credentials: 'same-origin' });
          if (csrfResp && csrfResp.ok) {
            const json = await csrfResp.json();
            csrfToken = json && (json.csrfToken || json.token || json.csrf);
          }
        } catch (e) {
          // ignore; we'll let server return a helpful error if CSRF is required
        }

        const response = await fetch('/api/pay', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', ...(csrfToken ? { 'X-CSRF-Token': csrfToken } : {}) },
          body: JSON.stringify({ sessionId })
        });

        const data = await response.json().catch(() => null);
        console.log('📨 /api/pay response:', data);

        if (!response.ok) {
          throw new Error(data.message || `HTTP ${response.status}: Payment initialization failed`);
        }

        if (data.status && data.url) {
          console.log('✅ Redirecting to Paystack:', data.url);
          window.location.href = data.url;
        } else {
          throw new Error(data.message || 'No payment URL received');
        }
      } catch (error) {
        console.error('❌ Payment error:', error);
        alert('Payment failed:\n\n' + error.message + '\n\nPlease go back and try again.');
        window.location.href = '/payment-summary.html';
      }
    }

    // Display order summary
    const cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
    if (cart.length > 0) {
      const detailsDiv = document.getElementById('details');
      const total = cart.reduce((sum, item) => sum + (item.price * (item.quantity || item.qty)), 0);
      detailsDiv.innerHTML = `
        <div class="detail-row">
          <span class="label">Items:</span>
          <span class="value">${cart.length}</span>
        </div>
        <div class="detail-row">
          <span class="label">Amount:</span>
          <span class="value">₦${total.toLocaleString()}</span>
        </div>
      `;
    }

    initiatePayment();
  </script>
  <script src="/cart-manager.js"></script>
</body>
</html>
