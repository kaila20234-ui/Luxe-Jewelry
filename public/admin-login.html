<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login | Luxe Jewelry</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        font-family: Poppins, sans-serif;
        background: linear-gradient(135deg, #2c3e50, #34495e);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #fff;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        width: 400px;
      }
      .logo {
        text-align: center;
        margin-bottom: 30px;
      }
      .logo i {
        font-size: 48px;
        color: #d4af37;
      }
      h2 {
        color: #2c3e50;
        margin-bottom: 8px;
        text-align: center;
      }
      .role-badge {
        display: inline-block;
        background: #e74c3c;
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        width: 100%;
        margin-bottom: 20px;
      }
      p.small {
        color: #666;
        margin-bottom: 20px;
        text-align: center;
      }
      .row {
        margin-bottom: 16px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
      }
      input:focus {
        outline: none;
        border-color: #d4af37;
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      }
      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #d4af37, #b8941e);
        border: none;
        color: #fff;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
      }
      .error {
        color: #c0392b;
        margin-top: 15px;
        font-size: 0.95rem;
        padding: 10px;
        background: #fadbd8;
        border-radius: 6px;
        border-left: 4px solid #c0392b;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: #999;
      }
      .footer a {
        color: #d4af37;
        text-decoration: none;
      }
      .success-message {
        color: #27ae60;
        margin-top: 10px;
        text-align: center;
      }
      .lock-icon {
        text-align: center;
        font-size: 36px;
        color: #e74c3c;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <i class="fas fa-crown"></i>
      </div>
      <div class="lock-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h2>Admin Portal</h2>
      <div class="role-badge"><i class="fas fa-shield-alt"></i> ADMIN ONLY</div>
      <p class="small">Restricted Access. Authorized administrators only.</p>
      <form id="loginForm">
        <div class="row">
          <input
            id="email"
            type="email"
            placeholder="Admin Email"
            required
            autocomplete="email"
          />
        </div>
        <div class="row">
          <input
            id="password"
            type="password"
            placeholder="Admin Password"
            required
            autocomplete="current-password"
          />
        </div>
        <div class="row">
          <button type="submit">
            <i class="fas fa-sign-in-alt"></i> Sign in as Admin
          </button>
        </div>
        <div class="error" id="err" style="display: none"></div>
        <div class="success-message" id="success" style="display: none"></div>
      </form>
      <div class="footer">
        <p>
          Are you a Manager? <a href="/manager-login.html">Manager Login →</a>
        </p>
        <p style="margin-top: 10px; color: #bbb">Luxe Jewelry © 2024</p>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const err = document.getElementById("err");
      const success = document.getElementById("success");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.style.display = "none";
        success.style.display = "none";
        err.textContent = "";
        success.textContent = "";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        // Validation
        if (!email) {
          err.textContent = "Email is required";
          err.style.display = "block";
          return;
        }
        if (!password) {
          err.textContent = "Password is required";
          err.style.display = "block";
          return;
        }

        try {
          // Fetch CSRF token
          const csrfResp = await fetch("/api/csrf-token", {
            credentials: "same-origin",
          });
          let csrfToken = null;
          if (csrfResp.ok) {
            const json = await csrfResp.json().catch(() => null);
            csrfToken = json && json.csrfToken;
          }

          const res = await fetch("/api/staff-login", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              ...(csrfToken ? { "X-CSRF-Token": csrfToken } : {}),
            },
            body: JSON.stringify({ email, password, role: "admin" }),
          });
          const data = await res.json();

          if (!data.success) {
            err.textContent =
              data.message || "Login failed. Please check your credentials.";
            err.style.display = "block";
            return;
          }

          if (data.role !== "admin") {
            err.textContent =
              "This account is not authorized as Admin. Please use the correct login.";
            err.style.display = "block";
            return;
          }

          // Save authentication data
          localStorage.setItem("authToken", data.token);
          localStorage.setItem("authRole", data.role);
          localStorage.setItem("authUser", email);
          localStorage.setItem("lastLogin", new Date().toLocaleString());

          success.textContent = "✓ Login successful! Redirecting...";
          success.style.display = "block";

          // Redirect to admin dashboard
          setTimeout(() => {
            globalThis.location.href = "/admin.html";
          }, 1000);
        } catch (e) {
          console.error(e);
          err.textContent = "Server error: " + e.message;
          err.style.display = "block";
        }
      });
    </script>
  </body>
</html>
