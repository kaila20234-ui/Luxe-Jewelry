openapi: 3.0.0
info:
  title: SIWES Jewelry E-Commerce API
  version: 1.0.0
  description: Complete API for jewelry e-commerce platform with authentication, payment processing, and product management
  contact:
    name: API Support
    email: support@jewelry.local
  license:
    name: ISC

servers:
  - url: http://localhost:5000/api
    description: Development server
  - url: https://api.jewelry.local/api
    description: Production server

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email, password, and role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, manager, customer]
              required: [email, password, role]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /products:
    get:
      tags:
        - Products
      summary: List products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /wishlist:
    get:
      tags:
        - Wishlist
      summary: Get user wishlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WishlistItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Wishlist
      summary: Add to wishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
              required: [productId]
      responses:
        '201':
          description: Added to wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/WishlistItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /wishlist/{id}:
    delete:
      tags:
        - Wishlist
      summary: Remove from wishlist
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed from wishlist
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /reviews:
    get:
      tags:
        - Reviews
      summary: Get reviews
      parameters:
        - name: productId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  averageRating:
                    type: number
                  totalReviews:
                    type: integer

    post:
      tags:
        - Reviews
      summary: Create review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                title:
                  type: string
                comment:
                  type: string
              required: [productId, rating, title]
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /reviews/{id}:
    put:
      tags:
        - Reviews
      summary: Update review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                title:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: Review updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

    delete:
      tags:
        - Reviews
      summary: Delete review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /search:
    get:
      tags:
        - Search
      summary: Search products
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, price, rating, newest]
        - name: page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /cart:
    get:
      tags:
        - Cart
      summary: Get shopping cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shopping cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    post:
      tags:
        - Cart
      summary: Add to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
              required: [productId, quantity]
      responses:
        '201':
          description: Added to cart
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /cart/{itemId}:
    put:
      tags:
        - Cart
      summary: Update cart item
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Cart updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'

    delete:
      tags:
        - Cart
      summary: Remove from cart
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item removed
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /payment/webhook:
    post:
      tags:
        - Payment
      summary: Payment webhook (Paystack)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                data:
                  type: object
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  order:
                    type: object

components:
  schemas:
    User:
      type: object
      properties:
        _id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, customer]
        createdAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
        description:
          type: string
        images:
          type: array
          items:
            type: string
        stock:
          type: integer
        rating:
          type: number
        reviews:
          type: integer

    WishlistItem:
      type: object
      properties:
        _id:
          type: string
        productId:
          type: string
        name:
          type: string
        price:
          type: number
        addedAt:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        _id:
          type: string
        productId:
          type: string
        userId:
          type: string
        userName:
          type: string
        rating:
          type: integer
        title:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: number
        itemCount:
          type: integer

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        code:
          type: string
        details:
          type: object
        timestamp:
          type: string
          format: date-time

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Products
    description: Product catalog
  - name: Wishlist
    description: User wishlist management
  - name: Reviews
    description: Product reviews
  - name: Search
    description: Product search
  - name: Cart
    description: Shopping cart
  - name: Payment
    description: Payment processing
